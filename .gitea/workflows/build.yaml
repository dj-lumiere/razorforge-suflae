name: Build and Test

on:
  push:
    branches: [main, wip/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Download native libraries
        run: |
          cd native

          # decNumber - IEEE 754 decimal floating-point (ICU License)
          echo "Cloning decNumber..."
          git clone --depth 1 https://github.com/SDL-Hercules-390/decNumber.git decNumber

          # LibBF - Arbitrary precision floating point (MIT)
          echo "Downloading LibBF..."
          curl -L -o libbf.tar.gz "https://bellard.org/libbf/libbf-2025-06-03.tar.gz"
          mkdir -p libbf
          tar -xzf libbf.tar.gz -C libbf --strip-components=1
          rm libbf.tar.gz

          # LibTomMath - Arbitrary precision integers (Public Domain)
          echo "Cloning LibTomMath..."
          git clone --depth 1 https://github.com/libtom/libtommath.git libtommath

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: SonarQube Begin
        run: |
          dotnet sonarscanner begin \
            /k:"razorforge-suflae" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: SonarQube End
        if: always()
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
