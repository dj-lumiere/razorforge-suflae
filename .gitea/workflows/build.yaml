name: Build and Test

on:
  push:
    branches: [main, wip/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Download native libraries
        run: |
          cd native

          # decNumber - IEEE 754 decimal floating-point (ICU License)
          # Provides D32/D64/D128 + arbitrary-precision Decimal. REPLACED Intel Decimal.
          # Without this, decimal_functions.c is #ifdef-stripped and rf_d32_from_string
          # (and every other rf_d*_*) symbol is missing from razorforge_runtime.so.
          echo "Cloning decNumber..."
          git clone --depth 1 https://github.com/SDL-Hercules-390/decNumber.git decNumber

          # LibBF - Arbitrary precision floating point (MIT)
          echo "Downloading LibBF..."
          curl -L -o libbf.tar.gz "https://bellard.org/libbf/libbf-2025-06-03.tar.gz"
          mkdir -p libbf
          tar -xzf libbf.tar.gz -C libbf --strip-components=1
          rm libbf.tar.gz

          # LibTomMath - Arbitrary precision integers (Public Domain)
          echo "Cloning LibTomMath..."
          git clone --depth 1 https://github.com/libtom/libtommath.git libtommath

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
