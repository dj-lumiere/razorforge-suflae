# The Rider build to compile/run against. LSP client support (com.intellij.platform.lsp)
# is available only in paid IDEs — Rider qualifies. Bump this to match your installed Rider
# (e.g. 2025.1 -> "2025.1"); sinceBuild in build.gradle.kts is derived from the branch number.
platformVersion=2024.3

# Silence the IntelliJ Platform Gradle plugin's search-in-EAP notices, speed up config.
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
